kind = "api"
previewPath = "/api"
title = "DeployCheck API"
version = "1.0.0"
id = "3B4_FFSkEVBkAeYMFRJ2e"

[[services]]
localPort = 8080
name = "API Server"
paths = ["/api"]

[services.development]
run = "python -m uvicorn deploycheck_api.main:app --app-dir artifacts/api-server --host 0.0.0.0 --port 8080"

[services.production]

[services.production.build]
args = ["uv", "sync", "--frozen"]

[services.production.run]
args = ["uv", "run", "--no-sync", "python", "-m", "uvicorn", "deploycheck_api.main:app", "--app-dir", "artifacts/api-server", "--host", "0.0.0.0", "--port", "8080"]

[services.production.run.env]
PORT = "8080"
NODE_ENV = "production"

[services.production.health.startup]
path = "/api/healthz"
